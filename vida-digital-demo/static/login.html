<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Iniciar sesión — Mi vida</title>
<style>
  :root{--papel:#F5EFE3;--papel-oscuro:#EDE3D0;--tinta:#302923;--tinta-suave:#6B5F4F;--linea:#D4C5AA;--sello:#955044;--sello-oscuro:#7D4037;--blanco-papel:#FBF8F1}
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;line-height:1.65}
  a{color:var(--tinta-suave)}
  a:hover{color:var(--sello)}
  button,input{font:inherit}
  button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--sello);outline-offset:3px}

  body{min-height:100vh;display:grid;place-items:center;padding:24px}
  .login{width:min(100%,390px)}
  .marca{font-family:system-ui,sans-serif;font-size:.66rem;letter-spacing:.17em;text-transform:uppercase;color:var(--sello);margin-bottom:8px}
  h1{font-size:2rem;font-weight:400;font-style:italic;line-height:1.2;margin:0 0 8px}
  .intro{color:var(--tinta-suave);font-size:.88rem;margin:0 0 28px}
  form{border-top:1px solid var(--linea);padding-top:25px}
  label{display:block;font-family:system-ui,sans-serif;font-size:.72rem;letter-spacing:.03em;color:var(--tinta-suave);margin:0 0 5px}
  input{width:100%;font-family:system-ui,sans-serif;font-size:.92rem;background:transparent;border:0;border-bottom:1px solid var(--linea);padding:10px 2px 9px;color:var(--tinta);margin-bottom:20px}
  input:focus{outline:none;border-bottom-color:var(--sello)}
  button{width:100%;font-family:system-ui,sans-serif;font-size:.8rem;font-weight:650;padding:11px 16px;border:1px solid var(--sello);background:var(--sello);color:#FBF3E7;cursor:pointer}
  button:hover{background:var(--sello-oscuro)}
  button:disabled{opacity:.6;cursor:not-allowed}
  #error{font-family:system-ui,sans-serif;font-size:.78rem;color:var(--sello-oscuro);margin-top:13px;display:none}
  .pie{font-family:system-ui,sans-serif;font-size:.7rem;color:var(--tinta-suave);margin-top:28px}
</style>
</head>
<body>
  <main class="login">
    <div class="marca">Memoricorde</div>
    <h1>Volver a tu historia</h1>
    <p class="intro">Continúa la conversación allí donde la dejaste.</p><div id="aviso" style="font: .78rem system-ui,sans-serif;color:#6B5F4F;margin-bottom:18px;display:none"></div>
    <form id="form-login">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit" id="btn-entrar">Continuar</button>
    </form>
    <div style="margin-top:14px;font:.72rem system-ui"><a href="#" id="olvido">He olvidado mi contraseña</a> · <a href="#" id="reenviar">Reenviar verificación</a></div>
    <p id="error"></p>
    <p class="pie"><a href="/registro.html">Crear una cuenta</a> &nbsp;·&nbsp; <a href="/">← Volver a la presentación</a> &nbsp;·&nbsp; <a href="/seguridad.html">Privacidad y seguridad</a></p>
  </main>
<script>

  const params = new URLSearchParams(location.search);
  const aviso=document.getElementById('aviso');
  if(params.get('verificado')==='1'){aviso.textContent='Correo verificado. Ya puedes entrar.';aviso.style.display='block';}
  if(params.get('registrado')==='1'){aviso.textContent='Cuenta creada. Revisa tu correo para verificarla antes de entrar.';aviso.style.display='block';}
  if(params.get('error')==='verificacion_invalida'){aviso.textContent='El enlace de verificación no es válido o ha caducado.';aviso.style.display='block';}
  document.getElementById('olvido').onclick=async e=>{e.preventDefault();const email=prompt('Escribe el correo asociado a tu cuenta:');if(!email)return;const r=await fetch('/api/solicitar-reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:'x'})});const d=await r.json().catch(()=>({}));aviso.textContent=d.mensaje||'Si existe una cuenta con ese correo, recibirás instrucciones.';aviso.style.display='block';};
  document.getElementById('reenviar').onclick=async e=>{e.preventDefault();const usuario=document.getElementById('usuario').value;const password=document.getElementById('password').value;if(!usuario||!password){aviso.textContent='Escribe primero tu usuario y contraseña.';aviso.style.display='block';return;}const r=await fetch('/api/reenviar-verificacion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario,password})});const d=await r.json().catch(()=>({}));aviso.textContent=d.mensaje||'Si la cuenta necesita verificación, se ha enviado un nuevo correo.';aviso.style.display='block';};

document.getElementById('form-login').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById('btn-entrar');
  const error = document.getElementById('error');
  error.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        usuario: document.getElementById('usuario').value,
        password: document.getElementById('password').value,
      }),
    });
    if (!resp.ok) {
      const data = await resp.json().catch(() => ({}));
      const detalle = Array.isArray(data.detail) ? data.detail.map(e => e.msg).join(' · ') : data.detail;
      error.textContent = detalle || 'Usuario o contraseña incorrectos.';
      error.style.display = 'block';
      return;
    }
    window.location.href = '/app.html';
  } catch (e) {
    error.textContent = 'Hubo un problema de conexión. Inténtalo de nuevo.';
    error.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
