<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restablecer contraseña — Memoricorde</title><style>:root{--papel:#F5EFE3;--tinta:#302923;--suave:#6B5F4F;--linea:#D4C5AA;--sello:#955044}*{box-sizing:border-box}body{margin:0;background:var(--papel);color:var(--tinta);font-family:Georgia,serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(390px,100%)}.marca{font:.66rem system-ui;color:var(--sello);letter-spacing:.17em;text-transform:uppercase}h1{font-weight:400;font-style:italic}p,label{font:.8rem system-ui;color:var(--suave)}input,button{width:100%;padding:11px;margin:7px 0 14px;font: .85rem system-ui}input{border:0;border-bottom:1px solid var(--linea);background:transparent}button{border:1px solid var(--sello);background:var(--sello);color:white;cursor:pointer}#msg{color:var(--tinta)}</style></head><body><main><div class="marca">Memoricorde</div><h1>Nueva contraseña</h1><p>Elige una contraseña de al menos 10 caracteres.</p><form id="f"><label>Nueva contraseña</label><input id="p" type="password" minlength="10" required autocomplete="new-password"><button>Guardar contraseña</button></form><p id="msg"></p></main><script>const token=new URLSearchParams(location.search).get('token')||'';document.getElementById('f').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');const r=await fetch('/api/restablecer-contrasena',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password_nueva:document.getElementById('p').value})});const d=await r.json().catch(()=>({}));msg.textContent=r.ok?'Contraseña actualizada. Ya puedes iniciar sesión.':(d.detail||'No se pudo actualizar la contraseña.');if(r.ok){document.getElementById('f').style.display='none';setTimeout(()=>location.href='/login.html',1200)}};</script></body></html>
