<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi vida — demo</title>
<style>
  :root {
    --papel: #f2e9d8;
    --papel-oscuro: #e8dcc4;
    --tinta: #3a3128;
    --tinta-suave: #6b5f4f;
    --linea: #cdbd9f;
    --sello: #a8574a;
    --sello-oscuro: #8c453a;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    background: var(--papel);
    background-image:
      radial-gradient(rgba(139, 115, 85, 0.05) 1px, transparent 1px);
    background-size: 3px 3px;
    color: var(--tinta);
    max-width: 640px;
    margin: 48px auto;
    padding: 0 20px 60px;
  }

  h2 {
    font-weight: 400;
    font-style: italic;
    font-size: 1.5rem;
    color: var(--tinta-suave);
    border-bottom: 1px solid var(--linea);
    padding-bottom: 14px;
    margin-bottom: 24px;
    letter-spacing: 0.02em;
  }

  #chat {
    background: var(--papel-oscuro);
    border: 1px solid var(--linea);
    border-radius: 2px;
    box-shadow: inset 0 1px 3px rgba(90, 70, 40, 0.15);
    padding: 20px 22px;
    min-height: 280px;
    margin-bottom: 16px;
  }

  .msg { margin-bottom: 16px; line-height: 1.55; font-size: 1.02rem; }
  .msg .etiqueta {
    display: block;
    font-family: system-ui, sans-serif;
    font-size: 0.7rem;
    color: var(--tinta-suave);
    margin-bottom: 3px;
  }
  .user { color: var(--tinta); }
  .ia { color: var(--tinta-suave); font-style: italic; }

  textarea {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    background: var(--papel-oscuro);
    border: 1px solid var(--linea);
    border-radius: 2px;
    padding: 10px 12px;
    color: var(--tinta);
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--sello); outline-offset: 1px; }

  .acciones { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }

  button {
    font-family: system-ui, sans-serif;
    font-size: 0.85rem;
    padding: 9px 16px;
    border-radius: 3px;
    border: 1px solid var(--linea);
    background: var(--papel);
    color: var(--tinta-suave);
    cursor: pointer;
  }
  button:hover { background: var(--papel-oscuro); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button:disabled:hover { background: var(--papel); }

  .escribiendo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: system-ui, sans-serif;
    font-size: 0.8rem;
    color: var(--tinta-suave);
    font-style: italic;
  }
  .punto {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--tinta-suave);
    animation: parpadeo 1.1s infinite ease-in-out;
  }
  .punto:nth-child(2) { animation-delay: 0.15s; }
  .punto:nth-child(3) { animation-delay: 0.3s; }
  @keyframes parpadeo {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; }
  }

  #btn-enviar {
    background: var(--sello);
    border-color: var(--sello-oscuro);
    color: #f7ede0;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  #btn-enviar:hover { background: var(--sello-oscuro); }

  #memoria, #transcripcion {
    white-space: pre-wrap;
    background: var(--papel-oscuro);
    border: 1px solid var(--linea);
    padding: 14px 16px;
    border-radius: 2px;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    color: var(--tinta-suave);
    margin-top: 16px;
    display: none;
  }

  .sesion-item {
    font-family: system-ui, sans-serif;
    font-size: 0.85rem;
    padding: 10px 12px;
    border: 1px solid var(--linea);
    border-radius: 2px;
    margin-top: 6px;
    cursor: pointer;
    color: var(--tinta-suave);
    background: var(--papel);
  }
  .sesion-item:hover { background: var(--papel-oscuro); }
</style>
</head>
<body>
  <h2>Mi vida — un archivo de recuerdos</h2>
  <div id="chat"></div>
  <textarea id="input" rows="3" placeholder="Escribe tu respuesta..."></textarea>
  <div class="acciones">
    <button id="btn-enviar" onclick="enviar()">Enviar</button>
    <button onclick="cerrarSesion(event)">Cerrar sesión de hoy</button>
    <button onclick="verMemoria(event)">Ver memoria acumulada</button>
    <button onclick="verSesiones(event)">Ver sesiones guardadas</button>
  </div>
  <pre id="memoria"></pre>
  <div id="lista-sesiones"></div>
  <pre id="transcripcion"></pre>

<script>
let sesionId = null;
let transcripcionAbiertaId = null;

async function enviar() {
  const input = document.getElementById('input');
  const texto = input.value.trim();
  if (!texto) return;
  añadirMensaje('user', texto);
  input.value = '';

  const btn = document.getElementById('btn-enviar');
  btn.disabled = true;
  input.disabled = true;
  mostrarEscribiendo();

  try {
    const resp = await fetch('/api/mensaje', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensaje: texto, sesion_id: sesionId })
    });
    const data = await resp.json();
    sesionId = data.sesion_id;
    quitarEscribiendo();
    añadirMensaje('ia', data.respuesta);
  } catch (e) {
    quitarEscribiendo();
    alert('Hubo un problema al enviar el mensaje. Inténtalo de nuevo.');
  } finally {
    btn.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

function mostrarEscribiendo() {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.id = 'indicador-escribiendo';
  div.className = 'escribiendo';
  div.innerHTML = 'la entrevistadora está pensando <span class="punto"></span><span class="punto"></span><span class="punto"></span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function quitarEscribiendo() {
  const el = document.getElementById('indicador-escribiendo');
  if (el) el.remove();
}

function añadirMensaje(rol, texto) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + rol;
  const etiqueta = document.createElement('span');
  etiqueta.className = 'etiqueta';
  etiqueta.textContent = rol === 'user' ? 'tú escribiste' : 'la entrevistadora';
  const cuerpo = document.createElement('span');
  cuerpo.textContent = texto;
  div.appendChild(etiqueta);
  div.appendChild(cuerpo);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function cerrarSesionPorId(id, btn) {
  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Generando resumen...';
  try {
    const resp = await fetch('/api/cerrar_sesion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sesion_id: id })
    });
    const data = await resp.json();
    if (data.error) {
      alert('Aviso: ' + data.error);
      btn.disabled = false;
      btn.textContent = textoOriginal;
      return;
    }
    alert('Sesión #' + id + ' cerrada y memoria actualizada.');
    if (sesionId === id) sesionId = null;
    await refrescarListaSesiones();
  } catch (e) {
    alert('Hubo un problema al cerrar la sesión.');
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

async function cerrarSesion(ev) {
  if (!sesionId) { alert('Todavía no has empezado una sesión.'); return; }
  const btn = ev.target;
  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Generando resumen...';
  try {
    const resp = await fetch('/api/cerrar_sesion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sesion_id: sesionId })
    });
    const data = await resp.json();
    if (data.error) {
      alert('Aviso: ' + data.error + '. Tu conversación no se ha perdido, pero el resumen no se actualizó esta vez. Revísalo con el desarrollador.');
      return;
    }
    alert('Sesión cerrada y memoria actualizada. Puedes cerrar la pestaña y volver otro día.');
    sesionId = null;
    document.getElementById('chat').innerHTML = '';
  } catch (e) {
    alert('Hubo un problema al cerrar la sesión. Inténtalo de nuevo.');
  } finally {
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

async function verMemoria(ev) {
  const btn = ev.target;
  const el = document.getElementById('memoria');

  if (el.style.display === 'block') {
    el.style.display = 'none';
    return;
  }

  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Cargando...';
  try {
    const resp = await fetch('/api/memoria');
    const data = await resp.json();
    el.style.display = 'block';
    el.textContent = JSON.stringify(data, null, 2);
  } finally {
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

async function refrescarListaSesiones() {
  const resp = await fetch('/api/sesiones');
  const sesiones = await resp.json();
  const contenedor = document.getElementById('lista-sesiones');
  contenedor.innerHTML = '<h3>Sesiones guardadas (haz clic para ver la transcripción completa)</h3>';
  if (sesiones.length === 0) {
    contenedor.innerHTML += '<p>Todavía no hay sesiones guardadas.</p>';
    return;
  }
  sesiones.forEach(s => {
    const div = document.createElement('div');
    div.className = 'sesion-item';
    const fecha = new Date(s.fecha).toLocaleString();

    const texto = document.createElement('span');
    texto.textContent = `Sesión #${s.id} — ${fecha} — ${s.num_turnos} turnos — ${s.cerrada ? 'cerrada' : 'abierta'}`;
    texto.style.cursor = 'pointer';
    texto.onclick = () => verTranscripcion(s.id);
    div.appendChild(texto);

    if (!s.cerrada) {
      const btnCerrar = document.createElement('button');
      btnCerrar.textContent = 'Cerrar esta sesión';
      btnCerrar.style.marginLeft = '10px';
      btnCerrar.style.fontSize = '0.75rem';
      btnCerrar.style.padding = '4px 10px';
      btnCerrar.onclick = (e) => {
        e.stopPropagation();
        cerrarSesionPorId(s.id, btnCerrar);
      };
      div.appendChild(btnCerrar);
    }

    contenedor.appendChild(div);
  });
}

async function verSesiones(ev) {
  const btn = ev.target;
  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Cargando...';
  try {
    await refrescarListaSesiones();
  } finally {
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

async function verTranscripcion(id) {
  const el = document.getElementById('transcripcion');

  if (transcripcionAbiertaId === id) {
    el.style.display = 'none';
    transcripcionAbiertaId = null;
    return;
  }

  const resp = await fetch(`/api/sesion/${id}`);
  const mensajes = await resp.json();
  el.style.display = 'block';
  el.textContent = mensajes
    .filter(m => m.role === 'user' || m.role === 'assistant')
    .map(m => `[${m.role === 'user' ? 'TÚ' : 'IA'}] ${m.content}`)
    .join('\n\n---\n\n');
  transcripcionAbiertaId = id;
}

// Mensaje inicial para arrancar la conversación
añadirMensaje('ia', 'Escribe algo (ej. "hola") para que empiece la entrevista.');
</script>
</body>
</html>
