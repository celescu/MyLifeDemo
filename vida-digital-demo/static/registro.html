<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crear cuenta — Mi vida</title><style>:root{--papel:#F5EFE3;--papel-oscuro:#EDE3D0;--tinta:#302923;--tinta-suave:#6B5F4F;--linea:#D4C5AA;--sello:#955044;--sello-oscuro:#7D4037}*{box-sizing:border-box}body{margin:0;background:var(--papel);color:var(--tinta);font-family:Georgia,serif;line-height:1.65}main{width:min(100%,460px);margin:60px auto;padding:0 24px 60px}.marca{font:.66rem system-ui,sans-serif;letter-spacing:.17em;text-transform:uppercase;color:var(--sello)}h1{font-size:2rem;font-weight:400;font-style:italic;margin:8px 0}.intro{color:var(--tinta-suave);font-size:.88rem;margin-bottom:28px}form{border-top:1px solid var(--linea);padding-top:25px}label{display:block;font:.72rem system-ui,sans-serif;color:var(--tinta-suave);margin:0 0 5px}input,select{width:100%;font:.92rem system-ui,sans-serif;background:transparent;border:0;border-bottom:1px solid var(--linea);padding:10px 2px;color:var(--tinta);margin-bottom:20px}button{width:100%;font:.8rem system-ui,sans-serif;font-weight:650;padding:11px 16px;border:1px solid var(--sello);background:var(--sello);color:#FBF3E7;cursor:pointer}button:disabled{opacity:.6}#error{font:.78rem system-ui,sans-serif;color:var(--sello-oscuro);display:none}.pie{font:.7rem system-ui,sans-serif;color:var(--tinta-suave);margin-top:28px}</style></head><body><main><div class="marca">Memoricorde</div><h1>Comenzar tu historia</h1><p class="intro">Crea tu cuenta, confirma tu correo y elige el modelo para la entrevista y para la autobiografía.</p><form id="form"><label>Usuario</label><input id="usuario" required minlength="3" maxlength="64" autocomplete="username"><label>Correo electrónico</label><input id="email" type="email" required maxlength="254" autocomplete="email"><label>Contraseña</label><input id="password" type="password" required minlength="10" autocomplete="new-password"><label>Modelo para la entrevista</label><select id="modelo_entrevista"></select><label>Modelo para la autobiografía</label><select id="modelo_autobiografia"></select><button id="crear">Crear cuenta</button></form><p id="error"></p><p class="pie"><a href="/login.html">Ya tengo una cuenta</a> · <a href="/seguridad.html">Privacidad y seguridad</a></p></main><script>
async function cargar(){const r=await fetch('/api/modelos-disponibles');const d=await r.json();for(const id of ['modelo_entrevista','modelo_autobiografia'])document.getElementById(id).innerHTML=d.map(m=>`<option value="${m.id}">${m.nombre}</option>`).join('');}cargar().catch(()=>{});document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('crear'),err=document.getElementById('error');err.style.display='none';b.disabled=true;b.textContent='Creando…';try{const r=await fetch('/api/registro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:document.getElementById('usuario').value,email:document.getElementById('email').value,password:document.getElementById('password').value,modelo_entrevista:document.getElementById('modelo_entrevista').value,modelo_autobiografia:document.getElementById('modelo_autobiografia').value})});const d=await r.json().catch(()=>({}));if(!r.ok){err.textContent=Array.isArray(d.detail)?d.detail.map(x=>x.msg).join(' · '):(d.detail||'No se pudo crear la cuenta.');err.style.display='block';return;}window.location.href='/login.html?registrado=1';}catch(_){err.textContent='Hubo un problema de conexión.';err.style.display='block';}finally{b.disabled=false;b.textContent='Crear cuenta';}});
</script></body></html>
